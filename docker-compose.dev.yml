services:
  # Dedicated local Postgres for the main HospAI app DB -- separate container,
  # separate port, separate named volume from every other Postgres on this
  # host (native :5432, ocr-postgres, other projects' containers), so this
  # never shares data with or gets confused for one of those.
  main-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hospai
      POSTGRES_PASSWORD: hospai_local_dev
      POSTGRES_DB: hospai
    ports:
      - "5434:5432"
    volumes:
      - main_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospai -d hospai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file:
      # DB_ENGINE/DATABASE_URL deliberately live only in this per-developer,
      # gitignored file -- NOT hardcoded below -- so everyone on the team can
      # point at the same shared Postgres (or their own) without editing this
      # tracked compose file. Previously DB_ENGINE/DB_PATH were hardcoded here,
      # which silently overrode whatever was in .env (compose `environment:`
      # always wins over `env_file:`), so a shared DATABASE_URL never took effect.
      - ./backend/.env
    environment:
      - PORT=5011
      - FLASK_ENV=development
      - SESSION_COOKIE_SECURE=false
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - OCR_BACKEND_URL=http://ocr-api:7620
    # Lets DATABASE_URL use host.docker.internal to reach a Postgres server
    # running natively on the host (as opposed to another container).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5011:5011"
    volumes:
      - ./backend:/app/backend
      # Without this, /data/healthcare.db only ever exists in the container's
      # writable layer -- every `docker compose down`/`--force-recreate` (not
      # just `restart`) silently wipes all patient/billing data. Bind-mounting
      # the same file `startdev` already uses at the repo root keeps data
      # identical and persistent across both dev paths.
      - ./healthcare.db:/data/healthcare.db
      # core/storage.py's local (non-S3) fallback resolves to /app/uploads --
      # one level *above* the /app/backend WORKDIR -- since the bulk-import
      # backend and celery-worker are separate containers, that path must be a
      # shared volume or the worker can never read a file the backend just
      # saved (confirmed via `docker exec ... print(ObjectStorage().local_base)`).
      - dev_uploads:/app/uploads
    depends_on:
      - redis
      - ocr-api
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    command: ["celery", "-A", "app.celery", "worker", "--loglevel=info", "--pool=solo"]
    env_file:
      - ./backend/.env
    environment:
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app/backend
      - ./healthcare.db:/data/healthcare.db
      - dev_uploads:/app/uploads
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:5011}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5011}
      - VITE_SYMPTOM_API_BASE=${VITE_SYMPTOM_API_BASE:-http://localhost:5002}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - backend
      - symptom-backend
    restart: unless-stopped

  marketing-site:
    build:
      context: .
      dockerfile: site/Dockerfile.dev
    environment:
      - VITE_APP_URL=${VITE_APP_URL:-http://localhost:5173}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "4173:4173"
    volumes:
      - ./site:/app/site
      - site_node_modules:/app/site/node_modules
    restart: unless-stopped

  symptom-backend:
    build:
      context: .
      dockerfile: symptom_backend/Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      - PORT=5002
      - FLASK_ENV=development
    ports:
      - "5002:5002"
    volumes:
      - ./symptom_backend:/app/symptom_backend
    restart: unless-stopped

  # The OCR/document-intelligence backend: FastAPI + Celery, its own Postgres
  # and Qdrant, sharing the main `redis` service (db index 1, so its Celery
  # queue never collides with the main app's). Only `backend` talks to this
  # (see backend/ai/ocr_portal_client.py) — nothing in the browser calls it
  # directly. The one thing genuinely kept external is the GPU vLLM model
  # server (`vllm-qwen-7b`, already running on host port 8700) — that's a
  # shared, heavy singleton resource, reached via host.docker.internal.
  ocr-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keppler
      POSTGRES_PASSWORD: keppler
      POSTGRES_DB: keppler
    volumes:
      - ocr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keppler -d keppler"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr-qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - ocr_qdrant_data:/qdrant/storage

  ocr-api:
    build:
      context: .
      dockerfile: ocr_portal/Dockerfile.dev
    env_file:
      - ./ocr_portal/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://keppler:keppler@ocr-postgres:5432/keppler
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - QDRANT_URL=http://ocr-qdrant:6333
      - VLLM_BASE_URL=http://host.docker.internal:8700/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7621:7620"
    volumes:
      - ./ocr_portal:/app/ocr_portal
      - ocr_uploads:/app/ocr_portal/uploads
    depends_on:
      ocr-postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ocr-qdrant:
        condition: service_started
    restart: unless-stopped

  ocr-worker:
    build:
      context: .
      dockerfile: ocr_portal/Dockerfile.dev
    command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    env_file:
      - ./ocr_portal/.env
    environment:
      - DATABASE_URL=postgresql+psycopg://keppler:keppler@ocr-postgres:5432/keppler
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - QDRANT_URL=http://ocr-qdrant:6333
      - VLLM_BASE_URL=http://host.docker.internal:8700/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ocr_portal:/app/ocr_portal
      - ocr_uploads:/app/ocr_portal/uploads
    depends_on:
      ocr-postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ocr-qdrant:
        condition: service_started
      ocr-api:
        condition: service_started
    restart: unless-stopped

volumes:
  frontend_node_modules:
  site_node_modules:
  redis_data:
  main_postgres_data:
  ocr_postgres_data:
  ocr_qdrant_data:
  ocr_uploads:
  dev_uploads:
