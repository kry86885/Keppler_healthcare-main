services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      - PORT=5001
      - DB_ENGINE=sqlite
      - DB_PATH=/data/healthcare.db
      - FLASK_ENV=development
      - SESSION_COOKIE_SECURE=false
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    command: ["celery", "-A", "app.celery", "worker", "--loglevel=info", "--pool=solo"]
    env_file:
      - ./backend/.env
    environment:
      - DB_ENGINE=sqlite
      - DB_PATH=/data/healthcare.db
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:5001}
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5001}
      - VITE_SYMPTOM_API_BASE=${VITE_SYMPTOM_API_BASE:-http://localhost:5002}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - backend
      - symptom-backend
    restart: unless-stopped

  marketing-site:
    build:
      context: .
      dockerfile: site/Dockerfile.dev
    environment:
      - VITE_APP_URL=${VITE_APP_URL:-http://localhost:5173}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "4173:4173"
    volumes:
      - ./site:/app/site
      - site_node_modules:/app/site/node_modules
    restart: unless-stopped

  symptom-backend:
    build:
      context: .
      dockerfile: symptom_backend/Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      - PORT=5002
      - FLASK_ENV=development
    ports:
      - "5002:5002"
    volumes:
      - ./symptom_backend:/app/symptom_backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
  site_node_modules:
  redis_data:
