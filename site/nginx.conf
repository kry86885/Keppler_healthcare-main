server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /login {
    try_files /login.html =404;
  }

  location = /register {
    try_files /contact.html =404;
  }

  location = /contact {
    try_files /contact.html =404;
  }

  location = /about {
    try_files /about.html =404;
  }

  location = /iterations {
    try_files /iterations.html =404;
  }

  location = /v1 {
    try_files /index-v1.html =404;
  }

  location = /v2 {
    try_files /index-v2.html =404;
  }

  location = /v3 {
    try_files /index-v3.html =404;
  }

  location = /v4 {
    try_files /index-v4.html =404;
  }

  location = /v5 {
    try_files /index-v5.html =404;
  }

  location = /terms {
    try_files /terms.html =404;
  }

  location = /privacy {
    try_files /privacy.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
