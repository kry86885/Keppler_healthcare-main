services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospai}
      POSTGRES_USER: ${POSTGRES_USER:-hospai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospai_secure_password}
    ports:
      - "5434:5432"
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospai} -d ${POSTGRES_DB:-hospai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 5001
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-50}
      PG_POOL_MAX: ${PG_POOL_MAX:-4}
      DATABASE_URL: ${DATABASE_URL:-postgresql://hospai:hospai_secure_password@postgres:5432/hospai}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.yourdomain.com}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-hospai_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_PEPPER: ${SESSION_PEPPER:?Set SESSION_PEPPER in .env}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: Lax
      ADMIN_ROUTE_PASSWORD: ${ADMIN_ROUTE_PASSWORD:?Set ADMIN_ROUTE_PASSWORD in .env}
      ADMIN_ROUTE_AUTH_COOKIE_NAME: hospai_admin_route_auth
      ADMIN_ROUTE_AUTH_TTL_SECONDS: 3600
      ADMIN_ROUTE_AUTH_SECRET: ${ADMIN_ROUTE_AUTH_SECRET:-change-this-admin-route-cookie-secret}
      AI_PROVIDER: ${AI_PROVIDER:-vllm}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8700/v1}
      VLLM_MODEL: ${VLLM_MODEL:-qwen2.5-vl-7b}
      VLLM_API_KEY: ${VLLM_API_KEY:-local}
      BUCKET_URL: ${BUCKET_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5011:5001"
    volumes:
      - ./volumes/app_data:/data
      - ./volumes/uploads:/app/uploads
      - ./volumes/rag_workspaces:/app/backend/rag_workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ./volumes/redis_data:/data

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PG_POOL_MAX: ${PG_POOL_MAX:-4}
      DATABASE_URL: ${DATABASE_URL:-postgresql://hospai:hospai_secure_password@postgres:5432/hospai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      AI_PROVIDER: ${AI_PROVIDER:-vllm}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8700/v1}
      VLLM_MODEL: ${VLLM_MODEL:-qwen2.5-vl-7b}
      VLLM_API_KEY: ${VLLM_API_KEY:-local}
      BUCKET_URL: ${BUCKET_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
    command: ["celery", "-A", "app.celery", "worker", "--loglevel=info"]
    volumes:
      - ./volumes/app_data:/data
      - ./volumes/uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  symptom-backend:
    build:
      context: .
      dockerfile: symptom_backend/Dockerfile
    environment:
      PORT: 5002
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.yourdomain.com}
      # Runs on the same local vLLM model as the main backend -- this
      # service has no Gemini/cloud-LLM path anymore.
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8700/v1}
      VLLM_MODEL: ${VLLM_MODEL:-qwen2.5-vl-7b}
      VLLM_API_KEY: ${VLLM_API_KEY:-local}
    ports:
      - "5002:5002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Empty string defaults force same-origin relative paths (/api/... and /api/symptom-ai/...)
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SYMPTOM_API_BASE: ${VITE_SYMPTOM_API_BASE:-}
    ports:
      - "5173:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      symptom-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
