<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>HospAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <style>
        body { margin: 0; background-color: #f8fafc; }
        .initial-loader {
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          height: 100vh; width: 100vw; font-family: 'Source Sans 3', sans-serif; color: #334155;
        }
        .spinner {
          width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top: 4px solid #3b82f6;
          border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      <div class="initial-loader">
        <div class="spinner"></div>
        <h2 style="font-weight: 600; font-size: 1.25rem;">Starting Keppler Healthcare...</h2>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
