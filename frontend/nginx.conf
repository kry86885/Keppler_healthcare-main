# Docker's embedded DNS server -- combined with putting the upstream hostname in a
# variable below (rather than a literal in proxy_pass), this makes nginx re-resolve
# backend/symptom-backend on every request instead of caching whatever IP they had at
# nginx's own startup. Without this, recreating either container (e.g. any code deploy)
# leaves nginx silently proxying to a dead IP -- every request 502s -- until nginx itself
# is restarted, even though the new container is healthy and reachable directly.
resolver 127.0.0.11 valid=10s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/symptom-ai/ {
    set $symptom_backend_upstream symptom-backend;
    # A variable in proxy_pass disables nginx's automatic location-prefix
    # replacement, so the URI here is spelled out explicitly via $request_uri
    # instead of relying on that (both target the same /api/symptom-ai/... path,
    # so this is a straight passthrough either way).
    proxy_pass http://$symptom_backend_upstream:5002$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    set $backend_upstream backend;
    proxy_pass http://$backend_upstream:5001$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
